<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vox</title>
</head>
<body>
<main id="app" data-state="idle" data-expanded="false">

  <div id="orbzone">
    <button id="orb" aria-label="Vox 语音状态" aria-live="off">
      <canvas id="core" aria-hidden="true"></canvas>
    </button>
    <p id="status" role="status">待机</p>
  </div>

  <section id="panel" aria-hidden="true">
    <div id="reply" role="log" aria-live="polite"></div>

    <!-- 确认卡是本产品唯一「点错了会有后果」的界面，所以它不是一张通知卡：
         顶部那条琥珀斜纹带借的是道闸与警示带，现实世界里「此处需要许可才能通过」
         就是这个长相。它与球的琥珀闸门同色，两处说的是同一件事。 -->
    <div id="confirm" hidden>
      <p class="confirm-head" id="confirm-title">需要确认才能执行</p>
      <pre id="confirm-cmd" tabindex="0" aria-label="待执行的命令原文"></pre>
      <p id="confirm-reason"></p>
      <div class="confirm-actions">
        <button id="confirm-deny" type="button">拒绝</button>
        <button id="confirm-allow" type="button">执行</button>
      </div>
    </div>
  </section>

</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

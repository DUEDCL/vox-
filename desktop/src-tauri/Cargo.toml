[package]
name = "evox_voice_wake"
version = "0.1.0"
description = "Independent EvoX voice wake window"
authors = ["EvoX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
# 命中区域的反序列化。两者本来就是 tauri 的传递依赖，锁文件里已是 1.0.228 / 1.0.149，
# 提成直接依赖不引入新版本。
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

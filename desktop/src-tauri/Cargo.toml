[package]
name = "evox_voice_wake"
version = "0.1.0"
description = "Independent EvoX voice wake window"
authors = ["EvoX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 语音栈配置 —— 见 docs/adr/001-voice-stack-selection.md
#
# 这个文件里只有**参数**。模型路径故意不在这里：路径走环境变量，理由与
# config/speaker.toml 同款 —— 一个进版本控制的配置文件不该记录某台机器的
# 磁盘布局，换机器就得改仓库。四个环境变量（都可不设，默认指向 models/）：
#
#   VOX_KWS_MODEL_DIR   唤醒模型目录（sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01）
#   VOX_ASR_MODEL_DIR   识别模型目录（sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23）
#   VOX_TTS_MODEL_DIR   合成模型目录（vits-melo-tts-zh_en）
#   VOX_VAD_MODEL       Silero VAD 模型文件（models/silero_vad.onnx）
#
# 声纹的阈值与时长在 config/speaker.toml，不在这里。写错的键会**报错而不是
# 被忽略**：一个「看起来配了但其实没生效」的键比没有这个键更糟。

[wake]
# 唤醒词表。空字符串 = 先看约定路径 config/keywords.txt，那个文件也不在才用模型自带的
# keywords.txt。控制台的「唤醒词」那一栏写的就是 config/keywords.txt，手改它等效。
#
# 词表的每一行是「拼音声母/韵母 @原文」—— 模型的 227 个建模单元就是这套音素，所以
# **不能直接写中文**：写中文那一行整行匹配不上，表现是这个词永远唤不醒而不是报错。
# 用控制台生成，或者看 core/audio/keywords.py。
keywords_file = ""

# 唤醒确认音：命中之后先应一声再开始听。没有这一声，人会以为没听见而重复喊，
# 而重复的第二遍会落进已经开着的识别器、变成请求文本的一部分。
#
# 分隔符收「，,；;|、」。空字符串 = 关掉。第一次用到时合成并缓存到 .vox/acks/，
# 之后直接播 wav —— 合成一句要 500–900 ms，那是唤醒之后最不该等的时候。
#
# **2026-08-29 换了这四句，因为上一版有两句是坏的。** 判据是把合成结果喂回本项目的 ASR
# 看识别成什么（每句 3 次）：旧的「嗯哼」被识别成**「你好」**，「咋了」峰值只有 0.035，
# 「嗯」合出来是**一整段静音**（peak 0.000）。规律是三字以上的实词短句可靠，一到两字的
# 叹词这个模型做不好 —— 它练的是朗读语料。现在这四句回读 3/3。
#
# 写自己喜欢的词可以，但改完值得跑一次回读检查（见 core/audio/acks.py 模块头那张表）。
# 「我在呢」「我在这儿」被排除只是因为回读丢了句末轻声（听成「我在」「我在这」），
# 那是流式端点的弱点不是合成缺陷，想用就放回来。
#
# 缓存文件在落盘前会做归一化 + 尾部淡出 + 头尾补静音：同一个模型对不同短句的音量能差
# 4 倍，而结尾没有余量会听成「戛然而止」。详见 acks.py 的 polish()。
acks = "你说吧，我听着呢，什么事呀，说吧我听着"

# KWS 命中阈值。低了误唤醒多，高了叫不应。0.25 是 sherpa-onnx 的推荐起点，
# 最终值应按 REAL-MIC 多场景实测调定（发布阻塞项 #1），不要凭感觉调。
keywords_threshold = 0.25

# 推理线程数。唤醒是常驻负载，这个数字直接进 30 分钟资源画像。
num_threads = 2

[asr]
# 关掉的话唤醒仍然工作，但不转写 —— 只唤醒模式，用于单独调唤醒率。
enabled = true
num_threads = 2

[tts]
# 关掉的话回合照常走完（仍发 tts.chunk 事件），只是不出声。
enabled = true

# 合成走本机还是云端。
#
#   "sherpa"     本机 VITS（models/vits-melo-tts-zh_en）。零联网、零费用，音质一般。
#                speaker_id 与 speed 生效，model / voice 忽略。
#   "dashscope"  阿里云百炼非实时 HTTP 合成（CosyVoice / Qwen-Audio-TTS）。
#                model / voice / key_env 生效，speaker_id 忽略，speed 映射成 rate。
#
# 云端那条路的密钥**只从环境变量读**，变量名见下面的 key_env。key 缺失时不会退回本机 ——
# 一个要求 longyuan 的人拿到 VITS 的默认女声会以为配置生效了，所以缺 key 就静音并报警告。
provider = "dashscope"

# --- 只有 provider = "dashscope" 时下面几个有意义 ---------------------------
#
# **2026-08-29 实测定下来的组合。** 过程与结论：
#
# | 组合 | 结果 |
# |---|---|
# | `cosyvoice-v2` + longyuan | 403 `AllocationQuota.FreeTierOnly` —— 不在你的免费额度里 |
# | `cosyvoice-v1` + longyuan | 400 `current user api does not support http call` —— v1 不走 HTTP |
# | **`qwen-audio-3.0-tts-plus` + `longanhuan_v3.6`** | **200，703ms/1.10s** ✅ |
#
# 关键约束（文档原话）：**每个 model 只支持一组特定的 voice，不能混用。** 所以 longyuan
# 这个名字在 qwen-audio-3.0-tts-plus 上是无效的 —— 实测 20 个候选音色名，只有
# `longanhuan_v3.6` 回 200，其余全部 411 `TTS speak operation failed`。
#
# 它是女声：合成一句话测基频中位数 **253 Hz**（女声区间 165–255 Hz）。样本在
# `.vox-ref/voice_*.wav`，可以自己听。
model = "qwen-audio-3.0-tts-plus"
voice = "longanhuan_v3.6"

# 自由指令：控制语气与情绪。**只有 qwen-audio-3.0-tts-* 支持**（文档明写只有 plus 和 flash）。
# 音色决定「是谁在说」，这一行决定「她怎么说」—— 想要温柔就在这里说，不要去改音色。
# 实测它真的生效：同一句话不带指令 2.69s，带这行 3.25s（「语速稍慢」被执行了）。
instruction = "用温柔、亲和、放松的语气说，语速稍慢，像在耳边轻声说话"

# 密钥的**变量名**，不是密钥。值写在 .env 里（已 gitignore），或者在控制台「密钥」那一栏
# 存进去。这个键**不可从网页修改** —— 让网页决定去读哪个环境变量等于让它决定把哪个凭据
# 发给百炼。
key_env = "VOX_DASHSCOPE_KEY"

# --- 只有 provider = "sherpa" 时下面两个有意义 -----------------------------
speaker_id = 0
num_threads = 2

# 语速。本机是 VITS 的 length_scale 倒数；云端映射成 rate（0.5–2.0）。
speed = 1.0

[input]
# 输入设备。空字符串 = 系统默认。
#
# **2026-08-29 从空字符串改成了 "2"，因为这台机器的系统默认输入设备在出零。**实测：
# 默认设备 `麦克风阵列 (Realtek(R) Audio)` 录 1 秒 peak = 0.00003（数值噪声，不是房间），
# 而 `[2] 耳机 (沉麟的耳机)` 同一时刻 peak = 0.188。Windows 上一个被静音 / 被隐私设置
# 拒绝 / 根本不在用的设备**不报错** —— 流照常打开、回调照常触发、样本全是零，于是唤醒
# 永远不命中而每一层都报告自己健康。那是「自定义唤醒词唤不醒」查了好几轮的真实原因。
#
# 改回 "" 的前提是先把内建麦克风修好（声音设置里取消静音 + 输入音量调上去，以及
# 设置 → 隐私和安全性 → 麦克风 → 允许桌面应用访问麦克风）。现在不必靠记性：capture
# 会在开麦 4 秒后把「全零输入」当 error 记进运行日志，控制台的就绪清单也报实时峰值。
#
# **填索引，不要填名字片段。** Windows 上同一个物理设备会以 MME / DirectSound / WASAPI /
# WDM-KS 四种 host API 重复出现，所以 device = "耳机" 会让 sounddevice 抛
# `Multiple input devices found` 而不是选一个。设备清单看控制台就绪清单，或者
# `.vox-ref/diagnose_wake.py`（它逐个设备录 1 秒并报峰值）。
device = "2"

# 采样率与块长。16 kHz 是三个模型共同的输入约定，改它等于换模型。
# blocksize 1600 = 100 ms/块：再小 CPU 上升，再大唤醒响应变钝。
sample_rate = 16000
blocksize = 1600

# 自适应输入增益。**默认开**，让「Windows 输入音量该调多少」不再是你的事。
#
# 实测这套东西的可用音量窗口很窄：系统输入音量默认（约 100）时每一句唤醒词的峰值都是
# 1.000（削波），声纹相似度稳定落在 0.34–0.48 进不去；调到 7 才开始命中，但又偏轻。
# 而窗口位置取决于用哪只麦克风、戴不戴耳机、离多远 —— 那不该由人每次去试。
#
# **它能做和不能做的：** 能把偏轻的信号抬到模型习惯的电平（跟一条缓释包络，不逐块归一，
# 否则语音自身的动态会被抹平）。**不能**救回削波 —— 削波发生在声卡的 ADC 里，采样进到
# 这里已经是一排平顶，任何软件增益只能等比缩小它。所以削波只被**报告**（就绪清单里的
# clipped_blocks），看到它不为零就该降 OS 那一侧的输入音量。
#
# 声纹另有一层进模型前的峰值归一化（core/audio/speaker.py 的 normalise_for_embedding），
# 因为注册走的是另一条路（浏览器或 sd.rec），两侧必须在同一个函数里对齐。
auto_gain = true

[orb]
# 唤醒球。构建缺失时自动降级为无头模式并如实报告，不会拖死启动。
enabled = true

# visible = false 意味着**待机时桌面上没有球**。它在唤醒词命中后弹出（同时应一声，见
# wake.acks），回合结束 hide_after_s 秒后收回去。设成 true 则一直显示 —— 调窗口位置、
# 调视觉的时候有用，日常用不着。
visible = true

# 回合结束到收回球之间等多久。不立刻收是因为连续对话模式下说完会回「在听」，
# 球在那几秒里是「我还在听」的唯一可见信号；每次新回合都会重置这个倒计时。
hide_after_s = 10.0

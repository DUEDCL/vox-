# 模型方案（多套并存，控制台的「模型配置」那一栏读写本文件）
#
# 可用环境变量覆盖本文件位置：VOX_MODELS_CONFIG
#
# ## 为什么是「多套方案」而不是三个字段
#
# 一套 ASR/TTS/LLM 的组合叫一个 profile。留多套的理由很实际：本机跑一套（离线、
# 隐私最好、慢），云端跑一套（快、要联网），换服务商时不必把上一套的端点抹掉再
# 手抄回来 —— 上一版控制台就是三个空输入框，换回去要重新查一遍文档。
#
# `active` 指向当前生效的那一套。切换只改这一行。
#
# ## 这里永远不写密钥
#
# 与 config/agents.toml 同一条规矩：只写**环境变量名**（`key_env`），值一律从环境
# 变量读。写进本文件的 key 会进版本库、进日志、进事件流 —— 三处都不该有它。
# 校验层面也会拦：形似密钥的值（长随机串、`sk-` 前缀）直接报错而不是被忽略。
#
# ## provider 与 base 的关系
#
# `provider` 是 core/console/providers.py 那张预设表里的 slug，填了它就不用写
# `base`/`proto`（从预设取）。`provider = "custom"` 时三项都要自己写。
# 预设里的端点**抄自各家文档，本项目没有复验**；控制台上那颗「探一下」按钮才是
# 判据（它真的发一次 GET {base}/models，401/403 是好结果，404 是路径拼错了）。

active = "local"

# ------------------------------------------------- 当前这一套（语音本机、算力上云）
# **名字是历史遗留，内容不是「全本机」** —— ADR 008 之后红线 1 由「本地优先」改成
# 「音频本地，算力上云」：唤醒/VAD/ASR/声纹仍然全部本机，合成与推理走云端。
# 改 `active` 那一行就能切到别的方案。
[profiles.local]
label = "语音本机 + 云端合成与推理"

[profiles.local.asr]
provider = "custom"
model = "qwen-audio-3.0-asr-flash"
# **必须是原生多模态端点，不是 compatible-mode/v1。** 使用者 2026-09-03 报的那个 400
# 就是这一行写成兼容端点：`qwen-audio-3.0-asr-flash` 要 `parameters.format`，而 OpenAI
# 协议里**没有地方放它**，于是兼容端点恒回 `UNSUPPORTED_FORMAT: format is empty`。
# 实测原生端点 + `data:audio/wav;base64,…` + `parameters.format` = 200，转写正确。
base = "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation"
proto = "dashscope"
key_env = "VOX_ASR_KEY"

# **运行时读的是 config/voice.toml 的 [tts]，不是这里。** 这一栏是控制台上的显示与编辑
# 面；两处必须一致，不一致时以 voice.toml 为准（见下面 key_env 那条的教训）。
[profiles.local.tts]
provider = "custom"
model = "qwen-audio-3.0-tts-plus"
voice = "longanhuan_v3.6"
base = "https://dashscope.aliyuncs.com/compatible-mode/v1"
proto = "openai"
key_env = "VOX_TTS_KEY"

# 云端推理。**key_env 2026-09-01 从 VOX_DASHSCOPE_KEY 改成 VOX_LLM_KEY。**
# 一个名字叫 DASHSCOPE 的变量被这条（端点是中转站）点名，于是为了让聊天能用而往它里面
# 存的是中转站的 key —— 而 config/voice.toml 的 TTS 读的正是那个变量，百炼回 401
# InvalidApiKey，表现为「回答不出声」。一个变量只服务一个角色。
[profiles.local.llm]
provider = "custom"
model = "claude-opus-5"
base = "https://api.justwoker.icu/v1"
proto = "openai"
key_env = "VOX_LLM_KEY"

# ---------------------------------------------------------------- 云端 LLM
# 语音仍然本机（红线不动），只有 LLM 出网。这是最常用的一套。
[profiles.cloud-llm]
label = "本机语音 + 云端 LLM"

[profiles.cloud-llm.asr]
provider = "sherpa-local"
model = "zipformer-zh-14M"

[profiles.cloud-llm.tts]
provider = "sherpa-local"
model = "vits-zh-single"

[profiles.cloud-llm.llm]
provider = "deepseek"
model = "deepseek-chat"
key_env = "VOX_LLM_KEY"

[profiles.test]
label = "test"

[profiles.test.asr]
provider = "sherpa-local"
model = "zipformer-zh-14M"

[profiles.test.tts]
provider = "openai"
model = "vits-zh-single"

[profiles.test.llm]
provider = "custom"
model = "claude-opus-5"
base = "https://api.justwoker.icu/v1"
proto = "openai"
key_env = "VOX_LLM_KEY"

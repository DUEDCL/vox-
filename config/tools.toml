# 平台自有工具配置(ADR 005:一道政策门,voice 与 agent 同样对待)
#
# 可用环境变量覆盖本文件位置:VOX_TOOLS_CONFIG
# 路径相对仓库根解析。未知键会**报错**而不是被忽略 —— 一个拼错的
# denied_names 会静默削弱沙箱,拼错比缺失更危险。

[fs]
enabled = true

# 沙箱根白名单。默认只有工作区;解析后不在任一根之下的路径一律拒绝
# (先 resolve 再判断,所以符号链接逃逸也拒)。
roots = ["."]

# 单文件读取上限,超出部分截断并在审计里标 truncated。
max_bytes = 262144

# 文件名黑名单(fnmatch,大小写不敏感)。凭据、私钥、生物特征。
denied_names = [
  ".env", ".env.*", "*.pem", "*.key", "id_rsa*", "id_ed25519*",
  "credentials.json", "*secret*", "*.voiceprint", "voiceprints.json",
  "*.pfx", "*.p12", ".netrc", ".npmrc", ".git-credentials",
]

# 目录黑名单:任一路径分量命中即拒。enrollment 是生物特征,memory 是个人数据。
denied_dirs = ["enrollment", "memory", ".git", ".venv", "node_modules", "__pycache__"]

[web]
enabled = true

# 域名黑名单(后缀匹配,含子域)。
blocked_domains = []

# 只保留标题 / URL / 摘要,不注入正文;条数与摘要长度都有上限。
max_results = 5
snippet_chars = 280

# 后端选择。**两个都默认关**,不填就还是「没有后端」——`web.search` 如实
# 报 no search backend is configured,出厂行为不变。详见
# core/tools/search_backends.py 的文件头。
#
# 自建 SearxNG 实例(推荐):零 key、零第三方,查询不出本机。填它就优先用它。
# 明文 HTTP 只许回环地址,带凭据的 URL 直接拒 —— 与会话桥接同款校验。
# 实例的 settings.yml 里 search.formats 必须含 json,否则 SearxNG 回 403。
searx_url = ""

# 兜底:DuckDuckGo 的无 key HTML 端点。它**是**一次对外网络请求 ——
# 打开等于每次 web.search 都出本机。所以它有一个自己的开关,而且叫这个名字。
# 只在 searx_url 为空时才会被用到。
allow_internet = true

# 单次检索超时(秒)。两个后端共用。
timeout_s = 8

[shell]
# **默认关闭**。要用就自己打开,并且自己维护下面的白名单。
# 「语音说一句话就能在本机执行命令」是本项目最大的攻击面。
enabled = false

# 命令前缀白名单(按 token 前缀匹配)。白名单外**拒绝而非询问** ——
# 询问会训练出无脑点确认的习惯。空列表 + enabled = true 等于什么都不许跑。
allow = []

# 白名单内的命令仍需一次显式确认(唤醒球上显示待执行命令)。
require_confirmation = true

# 未通过声纹校验的来源不许跑命令;agent 来源天然没有 speaker,因此也进不来。
require_verified_speaker = true

timeout_s = 20
max_output_bytes = 20000

# ---------------------------------------------------------------- 本机应用
#
# app.open 能启动哪些应用。**白名单，不是搜索**：能启动任意可执行文件等于代码执行，
# 而这条路的输入是语音转写 —— 「打开记事本」和「打开记账本」在一个 14M 的识别器上是
# 同一个音。所以这里是显式的「说出来的名字 → 可执行文件绝对路径」映射。
#
# 键会自动展开变体：配了「网易云音乐」，说「打开网易云」也开得起来（剥掉「音乐」
# 「播放器」「客户端」这类尾巴）。精确匹配永远优先。
#
# 下面这三条是 2026-08-29 从本机注册表的 DisplayIcon 字段读出来的实际安装位置。
# 换了安装位置就改这里 —— 文件不在时 app.open 会明确说「配了但文件不在」，不会静默失败。
[apps]
enabled = true

# 「放点音乐」「来首歌」这类泛指开哪个。空的话这类请求会报错而不是随便挑一个。
default_music = "网易云音乐"

[apps.entries]
"网易云音乐" = "D:/Music/CloudMusic/cloudmusic.exe"
"酷狗音乐" = "D:/recreation/KGMusic/KuGou.exe"
"洛雪音乐" = "D:/recreation/lxmusic/lx-music-desktop/lx-music-desktop.exe"

# 说出来的名字 → 一个**网页**。本机没装客户端、或者就是习惯用网页的那些放这里。
# 「给我打开抖音」走的是这一张表（使用者原话：「我习惯使用网页版刷视频」）。
#
# 和 entries 同一条规矩：白名单，不是搜索。先查 entries 再查这里，所以同名时本机应用赢。
# 地址里可以带 `{q}`，那样它就是个搜索页，必须有要搜的词才会打开。
[apps.sites]
"抖音" = "https://www.douyin.com/"
"哔哩哔哩" = "https://www.bilibili.com/"
"B站" = "https://www.bilibili.com/"
"知乎" = "https://www.zhihu.com/"
"微博" = "https://weibo.com/"
"油管" = "https://www.youtube.com/"
"YouTube" = "https://www.youtube.com/"

# 应用名 → 「带着一个搜索词打开」的模板，`{q}` 是那个词（会被 percent-encode）。
# 「我想听薛之谦的歌」要的不只是打开播放器，这张表是那句话的后半截。
#
# 两种形状：
#   * `http(s)://…` → 交给默认浏览器。**这一条已验证**：网页播放器打开搜索页就能点播放。
#   * 其他（`orpheus://search/{q}` 这类）→ 作为**一个 argv** 传给那个 exe。
#
# **2026-09-03 的实测状态**：网易云的客户端在这台机器上**没有注册 `orpheus://` 协议**
# （`HKCR` / `HKCU\Software\Classes` 里都只有 `cloudmusic.*` 文件关联），所以走系统协议
# 那条路不通；直接把 URI 当 argv 传给 `cloudmusic.exe` 进程能正常起来（不崩、不退出），
# 但**客户端有没有真的跳到搜索结果只有你在屏幕上看得到** —— 那是 REAL-WIN，我验不了。
#
# 所以默认给的是**已验证的那一条**（网页播放器）。想让桌面客户端来接就把下面两行换一下：
#   "网易云音乐" = "orpheus://search/{q}"
[apps.play]
"网易云音乐" = "https://music.163.com/#/search/m/?s={q}"
"酷狗音乐" = "https://www.kugou.com/yy/html/search.html#searchType=song&searchKeyWord={q}"

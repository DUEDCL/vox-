# 声纹准入配置 —— 见 docs/adr/002-speaker-verification.md
#
# 这个文件里只有阈值与时长。注册数据本身（生物特征）落在
# enrollment/voiceprints.json，已在 .gitignore 内，永不进版本控制。

[speaker]
# 是否要求声纹校验。false 是逃生阀（escape hatch）：它把系统退回
# 「谁都能唤醒」的旧行为，diagnose() 会把它报成一个警告。
require_verification = true

# 余弦相似度阈值。高了误拒本人，低了放进他人。
# 0.5 是 3D-Speaker CAM++（2026-08-29 起的默认模型，dim 192）的常用起点，最终值应按
# REAL-MIC 实测分布调定（发布阻塞项 #8），不要凭感觉调。
threshold = 0.5

# 校验用的最短音频时长（秒）。短于此值 embed() 拒绝而不是勉强算。
min_verify_seconds = 0.6

# 单次注册的最短总时长（秒）。enroll 是追加语义，补录可以叠加。
min_enroll_seconds = 1.5

# --- 输入侧闸（2026-08-24 加固）。它们抬高伪造成本，但**不是反欺骗** ---
# ADR 002 的局限不变：声纹门不防录音回放。这几项是先于模型运行的启发式，
# 目的是把明显不可用的音频和暴力尝试挡在模型之前。
#
# 静音下限（RMS）。低于此值直接拒，不进模型 —— 一段几乎无声的音频算出来的
# 相似度没有意义，而它恰好是最容易被误当成「本人」的输入。
min_rms = 0.002

# 削波饱和比例上限。超过此比例的样本贴在 ±1.0 就拒：过载的波形已经丢了
# 说话人特征。
max_clip_ratio = 0.05

# 多窗口一致校验的窗口数。>1 时要求逐窗都过同一阈值同一人。
# 默认 1（关闭）—— 打开之前需要 REAL-MIC 实测调参，否则本人会被误拒。
verify_windows = 1

# 连续拒绝多少次进入冷却。挡暴力尝试。
max_consecutive_rejections = 5

# 冷却时长（秒）。冷却期内一律拒答，隔日自动解封。
cooldown_s = 30.0

[capture]
# 内存环形缓冲长度（秒）。永不落盘、永不出进程。
# 3 秒 @16 kHz float32 约 192 KB。
buffer_seconds = 3.0

# KWS 命中时回看多长的音频送去校验（秒）。
#
# **这个值同时决定「试一句」和脚本闭环校验用多长的窗**，三处必须一致 —— 2026-08-30
# 实测：注册 3.0 s 的档案，用 1.0 s 的窗校验得 0.774，用 3.0 s 的窗得 0.846。也就是说
# 一个按 3 s 报分的诊断会比门实际给的分**高 0.07 以上**，而使用者看到的差距是 0.2。
# 一个报数比现实好的诊断比没有诊断更糟。
verify_seconds = 1.5

# 唤醒之后给多少秒开口（秒）。
#
# 修的是「唤醒后不马上说话，球就一直卡在『在听』，之后说话也不识别」。流式识别器的端点
# 检测在**一个字都没解出来**时 2.4 秒就报一次端点（`rule1_min_trailing_silence`），
# 而那一下此前会直接把聆听结束掉、并且不通知任何人：状态机还停在 LISTENING（球显示
# 「在听」），采集却已经回到唤醒模式，于是后面说的话只喂给 KWS。
#
# 现在端点报空转写时：还在这个宽限期内就换一条新的识别流继续听（所以中途停顿不致命），
# 超过了就结束聆听、把状态退回 IDLE 并记一条日志 —— 让「它不听了」这件事看得见。
listen_grace_s = 8.0
